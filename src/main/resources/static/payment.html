<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Request Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f2f5;
    }
    form {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin-top: 20px;
      padding: 10px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
  <script src="https://checkoutshopper-test.adyen.com/checkoutshopper/sdk/5.48.0/adyen.js"></script>
  <link rel="stylesheet" href="https://checkoutshopper-test.adyen.com/checkoutshopper/sdk/5.48.0/adyen.css"/>
</head>
<body>
  <div id="dropin-container"></div>
  <form id="paymentForm">
    <h2>Create Payment Request</h2>

    <label for="reference">Reference</label>
    <input type="text" id="reference" name="reference" value="ORDER_1234" />

    <label for="currency">Currency</label>
    <input type="text" id="currency" name="amount.currency" value="INR" />

    <label for="value">Amount Value</label>
    <input type="number" id="value" name="amount.value" value="100" />

    <label for="countryCode">Country Code</label>
    <input type="text" id="countryCode" name="countryCode" value="IN" />

    <label for="merchantAccount">Merchant Account</label>
    <input type="text" id="merchantAccount" name="merchantAccount" value="TCSAccount984ECOM" />

    <label for="shopperReference">Shopper Reference</label>
    <input type="text" id="shopperReference" name="shopperReference" value="arghyadey639" />

    <label for="shopperEmail">Shopper Email</label>
    <input type="email" id="shopperEmail" name="shopperEmail" value="arghyadey639@email.com" />

    <label for="returnUrl">Return URL</label>
    <input type="url" id="returnUrl" name="returnUrl" value="https://localhost8080/payment" />

    <button type="submit">Submit</button>
  </form>
  <script src="script.js"></script>
</body>
</html>
