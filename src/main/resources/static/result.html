<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <h1 id="paymentStatusId"></h1>
    </center>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get("status");
        if(status === "Authorised"){
            document.getElementById("paymentStatusId").innerHTML = "Payment Success";
            document.getElementById("paymentStatusId").style.color = "green";
        } else {
            document.getElementById("paymentStatusId").innerHTML = "Payment Failed";
            document.getElementById("paymentStatusId").style.color = "red";
        }
        
    </script>
</body>
</html>
