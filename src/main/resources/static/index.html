<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dropdown from API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    select, button {
      padding: 8px;
      font-size: 16px;
      border-radius: 5px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <center>
    <h3>Select Payment Method</h3>

    <select id="paymentMethodsDropdown">
      <option value="">Loading...</option>
    </select>

    <button id="confirmBtn">Confirm Selection</button>

    <p id="selectedValue"></p>
  </center>


  <script>
    const apiUrl = "http://localhost:8001/api/adyan-payment/payment-types";

    const dropdown = document.getElementById("paymentMethodsDropdown");
    const selectedValue = document.getElementById("selectedValue");
    const confirmBtn = document.getElementById("confirmBtn");


    async function loadPaymentMethods() {
      try {
        const apiResponse = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                merchantAccount: "TCSAccount984ECOM",
                countryCode: "IN",
                channel: "Web", 
                shopperLocale: "en-IN"
            })
        });
        const response = await apiResponse.json();
        const data = response.paymentMethods;

        dropdown.innerHTML = '<option value="">Select a method</option>';
        data.forEach(method => {
          const option = document.createElement("option");
          option.name = method.name;
          option.value  = method.type;
          option.textContent = method.name;
          dropdown.appendChild(option);
        });
      } catch (error) {
        console.error("Error loading payment methods:", error);
        dropdown.innerHTML = '<option value="">Failed to load</option>';
      }
    }

    loadPaymentMethods();

    // Step 2️⃣ — Track selection immediately
    dropdown.addEventListener("change", () => {
      const selectedOption = dropdown.options[dropdown.selectedIndex];
      console.log("User selected:", selectedOption.textContent, selectedOption.value);
      window.alert(`You selected: ${selectedOption.name} to Pay`);
      window.location.href = `payment.html?method=${encodeURIComponent(selectedOption.value)}`;
    });

    // Step 3️⃣ — Or use a button to confirm the chosen option
    confirmBtn.addEventListener("click", () => {
      const selectedOption = dropdown.options[dropdown.selectedIndex];
      if (selectedOption.value === "") {
        alert("Please select a payment method first!");
        return;
      }
      alert(`Confirmed: ${selectedOption.textContent} (${selectedOption.value})`);
    });
  </script>
</body>
</html>
